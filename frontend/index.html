<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report real values -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Safari and Chrome tint their own bars to this, so the browser chrome
         blends into the app instead of framing it -->
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BeatBiddr" />
    <title>BeatBiddr | Request Songs & Tip DJs</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />

    <!-- Fetched without blocking the first paint, then promoted once ready -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      />
    </noscript>

    <!-- Paints the app ground and a spinner before any JavaScript runs -->
    <style>
      html, body { margin: 0; background: #000000; overscroll-behavior: none; }
      #root { min-height: 100dvh; }
      .boot {
        position: fixed; inset: 0; display: flex; align-items: center;
        justify-content: center; background: #000000;
      }
      .boot i {
        width: 28px; height: 28px; border-radius: 50%; display: block;
        border: 2px solid #00E17A; border-top-color: transparent;
        animation: boot-spin .7s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot i { animation-duration: 2.4s; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot"><i></i></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
